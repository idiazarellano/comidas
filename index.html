<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c6b38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Comidas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ground:#f4f2ea; --surface:#fffdf7; --surface2:#eceadf; --line:#ddd9c9;
  --ink:#1f2418; --ink2:#5d6353; --ink3:#878b79;
  --acc:#4c6b38; --acc-soft:#e4ebd8; --acc-ink:#3b5429; --on-acc:#fffdf7;
  --warn:#9a6a14; --warn-soft:#f6ecd6;
  --bad:#a33b2a; --bad-soft:#f6ded8;
  --cold:#2d6a82; --cold-soft:#dceaf0;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14170f; --surface:#1d2117; --surface2:#262b1e; --line:#363c2b;
  --ink:#eef0e4; --ink2:#b3b8a5; --ink3:#848a76;
  --acc:#9cc47a; --acc-soft:#2b3a1e; --acc-ink:#b7d89a; --on-acc:#14170f;
  --warn:#d7a851; --warn-soft:#3a2f14;
  --bad:#e0836f; --bad-soft:#3c211a;
  --cold:#84bdd4; --cold-soft:#17303a;
}}
:root[data-theme="dark"]{
  --ground:#14170f; --surface:#1d2117; --surface2:#262b1e; --line:#363c2b;
  --ink:#eef0e4; --ink2:#b3b8a5; --ink3:#848a76;
  --acc:#9cc47a; --acc-soft:#2b3a1e; --acc-ink:#b7d89a; --on-acc:#14170f;
  --warn:#d7a851; --warn-soft:#3a2f14;
  --bad:#e0836f; --bad-soft:#3c211a;
  --cold:#84bdd4; --cold-soft:#17303a;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:Bitter,Georgia,serif;margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* shell */
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);
  border-bottom:1px solid var(--line);padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;letter-spacing:-.01em;flex:1}
header .sub{font-size:12px;color:var(--ink3);font-family:"Source Sans 3",sans-serif;font-weight:400}
.icobtn{background:none;border:0;font-size:19px;padding:4px 6px;line-height:1}
main{flex:1;padding:14px 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 2px 10px;font-size:10.5px;letter-spacing:.02em;
  color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav button b{font-size:19px;font-weight:400;line-height:1;padding:3px 16px;border-radius:999px;
  transition:background .2s}
nav button:not([aria-current]) b{filter:grayscale(1);opacity:.55}
nav button[aria-current]{color:var(--acc-ink)}
nav button[aria-current] b{background:var(--acc-soft)}

/* bloques */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.wrap{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2);font-size:14px}
.tiny{font-size:12.5px;color:var(--ink3)}
.sep{height:1px;background:var(--line);border:0;margin:12px 0}
.num{font-variant-numeric:tabular-nums}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;
  font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--ink2)}
.tag.hot{background:var(--bad-soft);color:var(--bad)}
.tag.cold{background:var(--cold-soft);color:var(--cold)}
.tag.ice{background:var(--acc-soft);color:var(--acc-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 13px;
  font-size:14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.sm{padding:5px 9px;font-size:13px}

/* lista de recetas */
.rec{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-left-width:4px;
  border-radius:var(--r);padding:11px 12px}
.rec.ok{border-left-color:var(--acc)}
.rec.casi{border-left-color:var(--warn)}
.rec.no{border-left-color:var(--line);opacity:.72}
.rec .id{font-family:Bitter,serif;font-size:12px;font-weight:700;color:var(--ink3);
  min-width:30px;padding-top:2px}
.rec .nm{font-weight:600;font-size:15px;line-height:1.25}
.rec .meta{font-size:12.5px;color:var(--ink3);margin-top:3px}
.rec .falta{font-size:12.5px;color:var(--warn);font-weight:600;margin-top:3px}
.star{background:none;border:0;font-size:16px;padding:0 2px;line-height:1;color:var(--ink3)}
.star.on{color:#c9a227}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.basebtn{text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.basebtn[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc)}
.basebtn .bn{font-size:13.5px;font-weight:600;line-height:1.2}
.basebtn .bp{font-size:11.5px;color:var(--ink3)}
.basebtn[data-base]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* «Mantener pulsado» (como en Registrador): se hunde poco a poco mientras se mantiene
   y, al cumplirse, rebota con un halo. */
.lp{transition:transform .5s cubic-bezier(.3,0,.8,.6),filter .5s ease}
.lp.holding{transform:scale(.92);filter:brightness(.92)}
.lpfired{animation:lppop .32s cubic-bezier(.2,.9,.3,1.4)}
@keyframes lppop{0%{transform:scale(.9);box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}60%{transform:scale(1.04)}100%{transform:scale(1);box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){.lp,.lp.holding{transition:none;transform:none}.lpfired{animation:none}}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;padding:0 0 6px}
td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}

input,select,textarea{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:96px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink3);
  letter-spacing:.05em;text-transform:uppercase;margin:0 0 4px}

/* hoja modal */
#sheet[hidden]{display:none!important}
#sheet{position:fixed;inset:0;z-index:60;background:rgba(15,18,10,.5);display:flex;align-items:flex-end}
#sheetIn{background:var(--ground);width:100%;max-width:560px;margin:0 auto;max-height:92vh;
  overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#sheetIn h2{font-size:19px;margin-bottom:2px}
.sheetbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}

ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin:3px 0}
.pasos{font-size:15px;line-height:1.55;color:var(--ink)}
.aviso{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:9px 11px;
  font-size:13.5px;font-weight:500}
.hint{background:var(--surface2);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--ink2)}
.dias{display:flex;flex-direction:column;gap:6px}
.dia{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dia .d{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase}
.dia select{padding:5px 6px;font-size:14px}
.big{font-family:Bitter,serif;font-size:26px;font-weight:600;line-height:1.15;text-wrap:balance}
</style>
</head>
<body>

<div id="app">
  <header>
    <div style="flex:1">
      <h1 id="ttl">Hoy</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="icobtn" id="gear" title="Ajustes" aria-label="Ajustes">⚙</button>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="sheet" hidden><div id="sheetIn"></div></div>

<script src="datos/catalogo.js"></script>
<script>
"use strict";
const K="comidas.v1";
const PASILLOS={tarros:"Tarros",verdura:"Verdura",proteina:"Proteína y lácteos",despensa:"Despensa"};
const DIAS=[["lun","Lun"],["mar","Mar"],["mie","Mié"],["jue","Jue"],["vie","Vie"]];
const CONSERV={congela:{dias:90,et:"🧊",txt:"congelado, 3 meses"},nevera4:{dias:4,et:"❄️",txt:"nevera, 3–4 días"},
  nevera5:{dias:5,et:"❄️",txt:"nevera, 5 días"},nevera7:{dias:7,et:"❄️",txt:"nevera, 7 días"},
  nevera14:{dias:14,et:"❄️",txt:"nevera, 14 días"}};

/* ---------- datos del usuario ---------- */
const vacio=()=>({schema:1,favoritos:[],ediciones:{},inventario:[],menus:{},compra:{},
  ajustes:{tema:"system",reserva:3}});
let D=vacio();
function cargar(){try{const s=localStorage.getItem(K);if(s)D=migrar(JSON.parse(s));}catch(e){}}
function migrar(d){d=Object.assign(vacio(),d);d.ajustes=Object.assign(vacio().ajustes,d.ajustes||{});return d;}
function guardar(){try{localStorage.setItem(K,JSON.stringify(D));}catch(e){}}

/* ---------- catálogo + ediciones ---------- */
const BASES=CATALOGO.bases, SALSAS=CATALOGO.salsas;
const base=id=>BASES.find(b=>b.id===id);
const salsa=id=>SALSAS.find(s=>s.id===id);
function receta(id){
  const r=CATALOGO.recetas.find(x=>x.id===id); if(!r) return null;
  const e=D.ediciones[id];
  return e?Object.assign({},r,e,{editada:true}):r;
}
const recetas=()=>CATALOGO.recetas.map(r=>receta(r.id));
const esFav=id=>D.favoritos.includes(id);
function fav(id){const i=D.favoritos.indexOf(id);i<0?D.favoritos.push(id):D.favoritos.splice(i,1);guardar();}

/* ---------- inventario ---------- */
const hoyISO=()=>new Date().toISOString().slice(0,10);
const dias=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function conservDe(it){
  if(it.clase==="base"){const b=base(it.ref);return b?b.conserv:"nevera4";}
  const r=receta(it.ref); return r&&r.congela?"congela":"nevera4";
}
const caducaEn=it=>CONSERV[conservDe(it)].dias-dias(it.fecha,hoyISO());
const nombreDe=it=>{const o=it.clase==="base"?base(it.ref):receta(it.ref);return o?o.nombre:it.ref;};
const stock=bid=>D.inventario.filter(i=>i.clase==="base"&&i.ref===bid)
  .reduce((n,i)=>n+i.porciones,0);
function meter(clase,ref,porciones){
  D.inventario.push({id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    clase,ref,porciones,fecha:hoyISO()});guardar();
}
function sacar(clase,ref,n){ // consume lo más antiguo primero
  const lot=D.inventario.filter(i=>i.clase===clase&&i.ref===ref).sort((a,b)=>a.fecha<b.fecha?-1:1);
  for(const l of lot){if(n<=0)break;const q=Math.min(n,l.porciones);l.porciones-=q;n-=q;}
  D.inventario=D.inventario.filter(i=>i.porciones>0);guardar();
}
const reserva=()=>D.inventario.filter(i=>i.clase==="plato"&&(receta(i.ref)||{}).tipo==="tupper")
  .reduce((n,i)=>n+i.porciones,0);

/* ---------- el motor: qué falta para cada receta ---------- */
function faltan(r,disp){ // disp: Set de bases que se dan por disponibles
  return (r.bases||[]).filter(b=>!disp.has(b.id)).map(b=>b.id);
}
const basesEnStock=()=>new Set(BASES.filter(b=>stock(b.id)>0).map(b=>b.id));

/* ---------- semana ---------- */
function semanaID(d){
  d=new Date(d||Date.now()); const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const a=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+"-W"+String(Math.ceil(((t-a)/864e5+1)/7)).padStart(2,"0");
}
const SEM=semanaID();
const menu=(w)=>D.menus[w]||(D.menus[w]={lun:"",mar:"",mie:"",jue:"",vie:"",finde:["",""]});
function platosSemana(w){const m=menu(w);return [...DIAS.map(d=>m[d[0]]),...(m.finde||[])].filter(Boolean);}

function necesidadesBases(w){ // {B1:{pide,hay,falta}}
  const n={};
  for(const id of platosSemana(w)){
    const r=receta(id); if(!r) continue;
    for(const b of r.bases||[]) n[b.id]=(n[b.id]||0)+b.porciones;
  }
  for(const [id,pide] of Object.entries(n)){ // una base que hay que cocinar puede gastar otra (B6 lleva B1)
    const b=base(id); if(!b.usa) continue;
    const tandas=Math.ceil(Math.max(0,pide-stock(id))/b.porciones);
    for(const u of b.usa) n[u.id]=(n[u.id]||0)+u.porciones*tandas;
  }
  return Object.entries(n).map(([id,pide])=>{
    const hay=stock(id), b=base(id);
    return {id,nombre:b.nombre,pide,hay,falta:Math.max(0,pide-hay),tandas:Math.ceil(Math.max(0,pide-hay)/b.porciones)};
  }).sort((a,b)=>b.falta-a.falta);
}
function listaCompra(w){
  const items={};
  const add=(x,de)=>{const k=(x.n||"").toLowerCase();if(!k)return;
    (items[k]=items[k]||{n:x.n,p:x.p||"despensa",cant:[],de:[]});
    if(x.c)items[k].cant.push(x.c); if(!items[k].de.includes(de))items[k].de.push(de);};
  for(const nb of necesidadesBases(w)) if(nb.tandas>0)
    for(let i=0;i<nb.tandas;i++) (base(nb.id).compra||[]).forEach(x=>add(x,nb.id));
  for(const id of platosSemana(w)){
    const r=receta(id); if(!r) continue;
    (r.fresco||[]).forEach(x=>add(x,r.id));
    (r.salsas||[]).forEach(sid=>(salsa(sid).compra||[]).forEach(x=>add(x,salsa(sid).nombre)));
  }
  const hechos=D.compra[w]||[];
  return Object.values(items).sort((a,b)=>a.n.localeCompare(b.n,"es"))
    .map(x=>Object.assign(x,{hecho:hechos.includes(x.n.toLowerCase())}));
}
function sesionCocina(w){
  return necesidadesBases(w).filter(n=>n.tandas>0).map(n=>{
    const b=base(n.id);
    return {id:n.id,nombre:b.nombre,minutos:b.minutos*n.tandas,puesto:b.puesto,tandas:n.tandas,prep:b.prep};
  }).sort((a,b)=>b.minutos-a.minutos);
}

/* ---------- pintar ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let vista="hoy", filtros={tipo:"tupper",frio:false,congela:false,rapido:false,fav:false};
let basesMarcadas=null; // null = usa el inventario

const TABS=[["hoy","🍽","Hoy"],["cocinar","🥘","Cocinar"],["semana","🗓","Semana"],
  ["despensa","🧊","Despensa"],["recetario","📖","Recetario"]];

function ir(v){vista=v;pintar();window.scrollTo(0,0);}
function pintar(){
  $("#nav").innerHTML=TABS.map(([v,i,n])=>
    `<button data-ir="${v}"${v===vista?' aria-current="page"':""}><b>${i}</b>${n}</button>`).join("");
  const T={hoy:"Hoy",cocinar:"Qué puedo hacer",semana:"Semana",despensa:"Despensa",recetario:"Recetario"};
  $("#ttl").textContent=T[vista];
  $("#sub").textContent=vista==="semana"?SEM.replace("-W"," · semana "):
    vista==="despensa"?`${reserva()} almuerzos de reserva`:
    new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  $("#main").innerHTML=({hoy:vHoy,cocinar:vCocinar,semana:vSemana,despensa:vDespensa,recetario:vRecetario})[vista]();
}

/* --- Hoy --- */
function vHoy(){
  const m=menu(SEM), k=DIAS[(new Date().getDay()+6)%7]; const idHoy=k?m[k[0]]:"";
  const r=idHoy?receta(idHoy):null;
  const manana=k?DIAS[DIAS.indexOf(k)+1]:null; const rm=manana&&m[manana[0]]?receta(m[manana[0]]):null;
  const cad=D.inventario.filter(i=>caducaEn(i)<=2).sort((a,b)=>caducaEn(a)-caducaEn(b));
  const res=reserva(), obj=D.ajustes.reserva;
  let h="";
  if(r){
    h+=`<div class="card stack">
      <div class="eyebrow">Almuerzo de hoy · ${esc(r.id)}</div>
      <div class="big">${esc(r.nombre)}</div>
      <div class="wrap">${tags(r)}</div>
      ${(r.alDia&&r.alDia.length)?`<div class="hint"><b>Añadir hoy</b><ul class="plain">${
        r.alDia.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`:""}
      <div class="row"><button class="btn sm" data-rec="${r.id}">Ver la receta</button></div>
    </div>`;
  }else{
    h+=`<div class="card stack"><div class="big">Hoy no hay plato elegido</div>
      <div class="muted">Elige los almuerzos de la semana y todo lo demás sale de ahí.</div>
      <div class="row"><button class="btn pri" data-ir="semana">Planear la semana</button></div></div>`;
  }
  if(rm) h+=`<div class="card row" style="justify-content:space-between">
    <div><div class="eyebrow">Mañana</div><div style="font-weight:600">${esc(rm.nombre)}</div></div>
    <button class="btn sm" data-sacar="${rm.id}">Sacar del congelador</button></div>`;
  h+=`<div class="card stack">
    <div class="eyebrow">Reserva del congelador</div>
    <div class="row" style="justify-content:space-between">
      <div class="big num" style="color:${res>=obj?"var(--acc)":"var(--warn)"}">${res} <span style="font-size:15px;color:var(--ink3);font-family:'Source Sans 3',sans-serif">almuerzos</span></div>
      <span class="tag ${res>=obj?"ice":"warn"}">objetivo ${obj}–5</span></div>
    ${res<obj?`<div class="muted">Cocina una tanda de más esta semana: cada receta da 3 raciones y la tercera va al congelador.</div>`:""}
  </div>`;
  if(cad.length) h+=`<div class="card stack"><div class="eyebrow">Cómetelo pronto</div>${
    cad.map(i=>`<div class="row" style="justify-content:space-between">
      <span>${esc(nombreDe(i))} <span class="tiny">· ${i.porciones} porc.</span></span>
      <span class="tag ${caducaEn(i)<0?"hot":"warn"}">${caducaEn(i)<0?"caducado":caducaEn(i)+" d"}</span></div>`).join("")}</div>`;
  return `<div class="stack">${h}</div>`;
}

/* --- Cocinar --- */
function vCocinar(){
  const disp=basesMarcadas||basesEnStock();
  const lista=recetas().filter(r=>
    (filtros.tipo==="todo"||r.tipo===filtros.tipo) &&
    (!filtros.frio||r.frio) && (!filtros.congela||r.congela) &&
    (!filtros.rapido||r.minutos<=20) && (!filtros.fav||esFav(r.id)))
    .map(r=>({r,f:faltan(r,disp)}))
    .sort((a,b)=>a.f.length-b.f.length||a.r.id.localeCompare(b.r.id));
  const listas=lista.filter(x=>x.f.length===0), casi=lista.filter(x=>x.f.length===1),
        resto=lista.filter(x=>x.f.length>1);
  return `<div class="stack">
    <div class="card stack">
      <div class="eyebrow">Bases que tienes <span style="text-transform:none;letter-spacing:0;font-weight:400">· mantén pulsada una para ver su receta</span></div>
      <div class="grid2">${BASES.map(b=>`<button class="basebtn" data-base="${b.id}" aria-pressed="${disp.has(b.id)}">
        <span class="bn">${b.icono} ${esc(b.nombre)}</span>
        <span class="bp">${b.id} · ${stock(b.id)?stock(b.id)+" porc. en casa":"sin existencias"}</span></button>`).join("")}</div>
      ${basesMarcadas?`<div class="row"><button class="btn sm" data-resetbases="1">Volver a lo que hay en la despensa</button></div>`:""}
    </div>
    ${barraFiltros()}
    <div class="stack">
      <div class="eyebrow">Listas · ${listas.length}</div>
      ${listas.length?listas.map(x=>fila(x.r,"ok")).join(""):`<div class="muted">Marca alguna base arriba.</div>`}
      <div class="eyebrow" style="margin-top:8px">Te falta una base · ${casi.length}</div>
      ${casi.map(x=>fila(x.r,"casi",x.f)).join("")}
      <details style="margin-top:6px"><summary class="eyebrow" style="cursor:pointer">El resto · ${resto.length}</summary>
        <div class="stack" style="margin-top:8px">${resto.map(x=>fila(x.r,"no",x.f)).join("")}</div></details>
    </div></div>`;
}
function barraFiltros(){
  const c=(k,n,v)=>`<button class="chip" data-filtro="${k}" data-val="${v||""}" aria-pressed="${
    k==="tipo"?filtros.tipo===v:filtros[k]}">${n}</button>`;
  return `<div class="wrap">${c("tipo","Tupper","tupper")}${c("tipo","Finde","finde")}${c("tipo","Todo","todo")}
    ${c("frio","🌡️ Frío")}${c("congela","🧊 Congela")}${c("rapido","≤20 min")}${c("fav","★ Favoritas")}</div>`;
}
function tags(r){
  let t="";
  if(r.calentar) t+=`<span class="tag hot">🔥 calentar</span>`;
  if(r.frio) t+=`<span class="tag cold">🌡️ frío</span>`;
  if(r.congela) t+=`<span class="tag ice">🧊 congela</span>`;
  if(r.congela===false) t+=`<span class="tag">no congelar</span>`;
  t+=`<span class="tag">${r.raciones} raciones</span><span class="tag">${r.minutos} min</span>`;
  return t;
}
function fila(r,cls,f){
  return `<div class="rec ${cls}">
    <span class="id">${r.id}</span>
    <button style="all:unset;flex:1;cursor:pointer" data-rec="${r.id}">
      <div class="nm">${esc(r.nombre)}</div>
      <div class="meta">${(r.bases||[]).map(b=>b.id).join(" · ")||"sin bases"} · ${r.minutos} min${
        r.frio?" · 🌡️":""}${r.congela?" · 🧊":""}</div>
      ${f&&f.length?`<div class="falta">falta ${f.map(id=>id+" "+base(id).nombre.toLowerCase()).join(", ")}</div>`:""}
    </button>
    <button class="star ${esFav(r.id)?"on":""}" data-fav="${r.id}" aria-label="Favorita">${esFav(r.id)?"★":"☆"}</button>
  </div>`;
}

      ${Object.keys(PASILLOS).filter(p=>porPasillo[p]).map(p=>`<div>

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-ir],[data-rec],[data-fav],[data-base],[data-baseficha],[data-filtro],"+
    "[data-cerrar],[data-cocinar],[data-editar],[data-guardar],[data-restaurar],[data-tanda],[data-add],"+
    "[data-menos],[data-sacar],[data-cocinado],[data-resetbases],[data-copiar],[data-pegar],[data-ajguardar]");
  if(!t){ if(e.target.id==="sheet") cerrar(); return; }
  const d=t.dataset;
  if(d.ir){cerrar();ir(d.ir);}
  else if(d.rec){fichaReceta(d.rec);}
  else if(d.fav!==undefined){fav(d.fav);pintar();if(!$("#sheet").hidden)fichaReceta(d.fav);}
  else if(d.base){basesMarcadas=new Set(basesMarcadas||basesEnStock());
    basesMarcadas.has(d.base)?basesMarcadas.delete(d.base):basesMarcadas.add(d.base);pintar();}
  else if(d.resetbases){basesMarcadas=null;pintar();}
  else if(d.baseficha){fichaBase(d.baseficha);}
  else if(d.filtro){if(d.filtro==="tipo")filtros.tipo=d.val;else filtros[d.filtro]=!filtros[d.filtro];pintar();}
  else if(d.cerrar){cerrar();}
  else if(d.cocinar){const r=receta(d.cocinar);
    (r.bases||[]).forEach(b=>sacar("base",b.id,b.porciones));
    meter("plato",r.id,r.raciones);cerrar();ir("despensa");}
  else if(d.tanda){const b=base(d.tanda);
    (b.usa||[]).forEach(u=>sacar("base",u.id,u.porciones));
    meter("base",b.id,b.porciones);cerrar();ir("despensa");}
  else if(d.editar){editor(d.editar);}
  else if(d.restaurar){delete D.ediciones[d.restaurar];guardar();fichaReceta(d.restaurar);pintar();}
  else if(d.guardar){
    const id=d.guardar, o=CATALOGO.recetas.find(x=>x.id===id), p={};
    const v=s=>$(s).value.trim();
    if(v("#edN")!==o.nombre)p.nombre=v("#edN");
    if(+$("#edR").value!==o.raciones)p.raciones=+$("#edR").value;
    if(+$("#edM").value!==o.minutos)p.minutos=+$("#edM").value;
    if(v("#edP")!==o.pasos)p.pasos=v("#edP");
    if(v("#edNo")!==(o.nota||""))p.nota=v("#edNo");
    const fr=v("#edF").split("\n").filter(Boolean).map(l=>{const[n,c]=l.split("|");
      const vi=(o.fresco||[]).find(x=>x.n===n.trim());
      return {n:n.trim(),c:(c||"").trim(),p:vi?vi.p:"despensa"};});
    if(JSON.stringify(fr)!==JSON.stringify(o.fresco||[]))p.fresco=fr;
    const al=v("#edD").split("\n").filter(Boolean);
    if(JSON.stringify(al)!==JSON.stringify(o.alDia||[]))p.alDia=al;
    if(Object.keys(p).length)D.ediciones[id]=p; else delete D.ediciones[id];
    guardar();fichaReceta(id);pintar();}
  else if(d.add){const[c,ref]=$("#addRef").value.split(":");meter(c,ref,+$("#addN").value||1);pintar();}
  else if(d.menos){const i=D.inventario.find(x=>x.id===d.menos);
    if(i){i.porciones--;D.inventario=D.inventario.filter(x=>x.porciones>0);guardar();pintar();}}
  else if(d.sacar){const r=receta(d.sacar);sacar("plato",r.id,1);pintar();}
  else if(d.cocinado){sesionCocina(SEM).forEach(s=>{
      for(let i=0;i<s.tandas;i++){(base(s.id).usa||[]).forEach(u=>sacar("base",u.id,u.porciones));
        meter("base",s.id,base(s.id).porciones);}});ir("despensa");}
  else if(d.copiar){navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(D));
    t.textContent="Copiado ✓";}
  else if(d.pegar){const b=$("#ajB");b.readOnly=false;b.value="";b.focus();
    t.textContent="Pega y guarda";t.dataset.pegar="";t.dataset.ajguardar="1";}
  else if(d.ajguardar){
    const b=$("#ajB");
    if(!b.readOnly&&b.value.trim()){try{D=migrar(JSON.parse(b.value));}catch(err){alert("Ese texto no es una copia válida.");return;}}
    D.ajustes.tema=$("#ajT").value; D.ajustes.reserva=+$("#ajR").value||3;
    guardar();tema();cerrar();pintar();}
});
document.addEventListener("change",e=>{
  const d=e.target.dataset;
  if(d.dia){menu(SEM)[d.dia]=e.target.value;guardar();pintar();}
  else if(d.finde!==undefined&&d.finde!==""){const m=menu(SEM);m.finde=m.finde||["",""];
    m.finde[+d.finde]=e.target.value;guardar();pintar();}
  else if(d.compra){const w=SEM;const l=D.compra[w]=D.compra[w]||[];
    const i=l.indexOf(d.compra); i<0?l.push(d.compra):l.splice(i,1);guardar();pintar();}
});
$("#gear").addEventListener("click",ajustes);

// Pulsación larga (500 ms) sobre una base en «Cocinar»: abre su receta en vez de marcarla.
let lp={timer:null,fired:false,x:0,y:0,el:null};
const LP_SEL=".basebtn[data-base]";
function lpClear(){clearTimeout(lp.timer);lp.timer=null;if(lp.el){lp.el.classList.remove("holding","lp");lp.el=null;}}
document.addEventListener("pointerdown",ev=>{
  lp.fired=false;
  const el=ev.target.closest(LP_SEL); if(!el) return;
  lp.x=ev.clientX; lp.y=ev.clientY;
  lp.el=el; el.classList.add("lp"); requestAnimationFrame(()=>{if(lp.el===el)el.classList.add("holding");});
  lp.timer=setTimeout(()=>{lp.fired=true; if(navigator.vibrate) navigator.vibrate(15);
    lpClear(); el.classList.add("lpfired"); el.addEventListener("animationend",()=>el.classList.remove("lpfired"),{once:true});
    fichaBase(el.dataset.base);},500);
});
document.addEventListener("pointermove",ev=>{if(lp.timer&&Math.hypot(ev.clientX-lp.x,ev.clientY-lp.y)>10)lpClear();});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,lpClear));
document.addEventListener("contextmenu",ev=>{if(ev.target.closest(LP_SEL))ev.preventDefault();});
// el clic que cierra la pulsación larga no debe marcar la base ni cerrar la ficha recién abierta
document.addEventListener("click",e=>{if(lp.fired){lp.fired=false;e.stopPropagation();e.preventDefault();}},true);

function tema(){const t=D.ajustes.tema;
  if(t==="system")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);}

cargar();
if(!D.inventario.length&&!Object.keys(D.menus).length){ // arranque con el menú de la semana 40
  Object.assign(menu(SEM),{lun:"T1",mar:"T3",mie:"T5",jue:"T1",vie:"T6",finde:["F1","F2"]});
  D.favoritos=["T1","T17","T26"];
  meter("base","B1",5); meter("base","B2",2); meter("plato","T1",1); meter("plato","T6",1);
}
tema(); pintar();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
</script>
